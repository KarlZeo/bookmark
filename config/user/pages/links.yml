# 默认页面配置（请勿直接修改）。
# 建议复制到 config/user/pages/projects.yml 并按需调整。
title: 链接快捷导航 # 页面标题
subtitle: 常用链接快速导航 # 页面副标题

# 指定使用的模板文件名，现有页面模板可见 templates/pages（不含 .hbs）
template: projects

# 页面分类与站点列表
#
# projects 模板采用“代码仓库风”卡片（repo 风格）。
# 统计信息（language/stars/forks）为自动获取数据：
# - 运行 `npm run sync-projects` 会联网抓取 GitHub 仓库信息，并写入 dev/ 缓存（仓库默认 gitignore）
# - `npm run build` 默认不联网；缓存缺失时卡片仅展示标题与描述
categories:
  - name: SteamOS常用项目导航
    icon: fas fa-code # 分类图标（Font Awesome）
    sites:
      - name: decky-lsfg-vk
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Decky plugin to streamline installation and usage of lsfg-vk; the Lossless Scaling compatibility layer for linux
        url: https://github.com/xXJSONDeruloXx/decky-lsfg-vk
      - name: MAKO
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Next-generation, Vulkan-powered graphics layer for Linux gaming, bringing Lossless Scaling frame generation and scaling to Steam Deck, Steam Machine and desktop Linux.
        url: https://github.com/eugeniosegala/MAKO
      - name: decky-dlss-enabler
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: DLSS Enabler patch/unpatcher for SteamOS game mode
        url: https://github.com/xXJSONDeruloXx/decky-dlss-enabler
      - name: Decky-Framegen
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Steam Deck Plugin to apply Framegen mods to games by replacing DLSS DLL with FSR3 DLL
        url: https://github.com/xXJSONDeruloXx/Decky-Framegen
      - name: DeckyClash
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Light-weight Clash/Mihomo proxy client for Steam OS
        url: https://github.com/chenx-dust/DeckyClash
      - name: CheatDeck
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: A launch options manager allows you to run games with cheats and trainers.
        url: https://github.com/SheffeyG/CheatDeck
      - name: ludusavi
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Backup tool for PC game saves
        url: https://github.com/mtkennerly/ludusavi
      - name: decky-ludusavi
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Rudimentary ludusavi interface as a decky plugin.
        url: https://github.com/GedasFX/decky-ludusavi
      - name: unifideck
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: A Decky Loader plugin that brings together games from Steam, Epic Games Store, GOG and Amazon into a single, unified library experience on your Steam Deck.
        url: https://github.com/mubaraknumann/unifideck
      - name: decky-wine-cellar
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: A Decky Loader plugin to manage Steam Play compatibility tools.
        url: https://github.com/FlashyReese/decky-wine-cellar
      - name: proton-ge-custom
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Compatibility tool for Steam Play based on Wine and additional components
        url: https://github.com/GloriousEggroll/proton-ge-custom
      - name: linuwux-runtime
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: LD_PRELOAD Runtime providing the host-side interpositions needed for specific CPUID-faulting + signal protocol under GE-Proton / CachyOS Proton.
        url: https://github.com/brcly/linuwux-runtime
      - name: proton-linuwux
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Automated Proton-GE and Proton-CachyOS builds patched with LinUwUx.patch.
        url: https://codeberg.org/xshaduwulfx/proton-linuwux
      - name: hv-launcher
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: A quick readiness check and launch manager for hypervisor games
        url: https://github.com/RemakeCode/hv-launcher
      - name: CreamDeck
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: A Decky Loader plugin for unlocking game DLCs
        url: https://github.com/Qiming-Liu/CreamDeck
      - name: HV-Decky
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: HV-Decky - Decky Plugin for HV bypass
        url: https://cs.rin.ru/forum/viewtopic.php?t=159990
      - name: SteamAnyAspectRatioMods
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
        description: Play your favorite games at the aspect ratio you want, on the platform you choose. This collection provides easy to use, cross platform aspect ratio fixes for games in Proton/Wine/Linux/MacOS/SteamOS/Windows.
        url: https://github.com/TLin-Y/SteamAnyAspectRatioMods
      - name: Decky-Game-Cheats-Manager
        icon: fab fa-github # 手动图标（manual 模式显示；favicon 模式下作为回退）
